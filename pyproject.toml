[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crewai-cloro"
version = "0.1.0"
description = "CrewAI tools for cloro: live Google search results with the AI Overview, and Google AI Mode, Bing AI Mode, ChatGPT and Gemini answers with sources."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["CrewAI", "cloro", "Web Search", "Google", "AI Overview", "AI Mode", "Bing", "ChatGPT", "Gemini", "agents"]
authors = [{ name = "cloro", email = "support@cloro.dev" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = ["crewai>=1.0.0", "httpx>=0.27.0"]

[project.urls]
Homepage = "https://cloro.dev/?utm_source=crewai-cloro&utm_medium=byok"
Documentation = "https://github.com/cloro-dev/crewai-cloro#readme"
Issues = "https://github.com/cloro-dev/crewai-cloro/issues"
Source = "https://github.com/cloro-dev/crewai-cloro"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.11"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "LICENSE", "README.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/crewai_cloro"]

[tool.ruff]
line-length = 120
target-version = "py310"
